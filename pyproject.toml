[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adf-merge"
version = "0.1.0"
description = "Incremental release-diff pipeline for Address Fabric USA (adf_usa)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyspark>=4.0", "pandas", "pyarrow"]

[project.scripts]
adf-detect = "adf_merge.cli:detect_main"
adf-release = "adf_merge.cli:release_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
